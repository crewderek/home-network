version: '3.8'

services:
  vikunja_db:
    image: postgres:18.3-alpine
    environment:
      - POSTGRES_USER=vikunja
      - POSTGRES_PASSWORD=${VIKUNJA_DATABASE_PASSWORD}
      - POSTGRES_DB=vikunja
    volumes:
      - ${VIKUNJA_DIRECTORY}/postgres:/var/lib/postgresql
    networks:
      - vikunja_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.ceph_mount == true

  vikunja:
    image: vikunja/vikunja:0.24.6
    environment:
      - VIKUNJA_DATABASE_TYPE=postgres
      - VIKUNJA_DATABASE_HOST=vikunja_db:5432
      - VIKUNJA_DATABASE_DATABASE=vikunja
      - VIKUNJA_DATABASE_USER=vikunja
      - VIKUNJA_DATABASE_PASSWORD=${VIKUNJA_DATABASE_PASSWORD}
      - VIKUNJA_REDIS_ENABLED=true
      - VIKUNJA_REDIS_HOST=vikunja_redis:6379
      - VIKUNJA_SERVICE_FRONTENDURL=https://${VIKUNJA_SUBDOMAIN}.${BASE_DOMAIN}
      - VIKUNJA_SERVICE_JWTSECRET=${VIKUNJA_JWT_SECRET}
      - VIKUNJA_AUTH_OPENID_ENABLED=true
      - VIKUNJA_AUTH_OPENID_REDIRECTURL=https://${VIKUNJA_SUBDOMAIN}.${BASE_DOMAIN}/auth/openid/authentik
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_NAME=authentik
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_AUTHURL=${AUTHENTIK_URL}/application/o/vikunja/
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTID=${VIKUNJA_OIDC_CLIENT_ID}
      - VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHENTIK_CLIENTSECRET=${VIKUNJA_OIDC_CLIENT_SECRET}
    volumes:
      - ${VIKUNJA_DIRECTORY}/files:/app/vikunja/files
    networks:
      - vikunja_network
      - proxy_private
      - kuma_network
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vikunja.rule=Host(`${VIKUNJA_SUBDOMAIN}.${BASE_DOMAIN}`)"
        - "traefik.http.routers.vikunja.entrypoints=websecure"
        - "traefik.http.routers.vikunja.tls=true"
        - "traefik.http.routers.vikunja.tls.certresolver=mydnschallenge"
        - "traefik.http.services.vikunja.loadbalancer.server.port=3456"
        - "traefik.docker.network=proxy_private"
        - "traefik.http.routers.vikunja.tls.domains[0].main=${BASE_DOMAIN}"
        - "traefik.http.routers.vikunja.tls.domains[0].sans=*.${BASE_DOMAIN}"
        - "kuma.vikunja-group.group.name=Vikunja"
        - "kuma.vikunja.http.name=Vikunja"
        - "kuma.vikunja.http.url=http://vikunja:3456"
        - "kuma.vikunja.http.interval=300"
        - "kuma.vikunja.http.parent_name=vikunja-group"
      placement:
        constraints:
          - node.labels.ceph_mount == true
          - node.labels.type != restricted
      replicas: 1
      restart_policy:
        condition: on-failure

  vikunja_redis:
    image: redis:8-alpine
    networks:
      - vikunja_network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.type != restricted

networks:
  vikunja_network:
    driver: overlay
  proxy_private:
    external: true
    name: proxy_private
  kuma_network:
    external: true
    name: kuma_network

