version: '3.8'

services:
  openbao:
    image: quay.io/openbao/openbao:${OPENBAO_VERSION}
    command: server
    cap_add:
      - IPC_LOCK
    networks:
      - openbao-internal
      - proxy_private
      - kuma_network
    volumes:
      - ${OPENBAO_DATA_DIRECTORY}:/vault/data
    environment:
      - BAO_API_ADDR=https://${OPENBAO_SUBDOMAIN}.${BASE_DOMAIN}
      - BAO_LOCAL_CONFIG={"ui":true,"storage":{"raft":{"path":"/vault/data","node_id":"openbao-1"}},"listener":[{"tcp":{"address":"0.0.0.0:8200","tls_disable":1}}]}
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.openbao.rule=Host(`${OPENBAO_SUBDOMAIN}.${BASE_DOMAIN}`)"
        - "traefik.http.routers.openbao.entrypoints=websecure"
        - "traefik.http.routers.openbao.tls=true"
        - "traefik.http.routers.openbao.tls.certresolver=mydnschallenge"
        - "traefik.http.services.openbao.loadbalancer.server.port=8200"
        - "traefik.docker.network=proxy_private"
        - "traefik.http.routers.openbao.tls.domains[0].main=${BASE_DOMAIN}"
        - "traefik.http.routers.openbao.tls.domains[0].sans=*.${BASE_DOMAIN}"
        - "kuma.security.group.name=Security"
        - "kuma.openbao.http.name=OpenBao"
        - "kuma.openbao.http.url=http://openbao:8200/v1/sys/health"
        - "kuma.openbao.http.interval=300"
        - "kuma.openbao.http.parent_name=security"
      replicas: 1
      placement:
        constraints:
          - node.labels.ceph_mount == true
          - node.labels.type != restricted
      restart_policy:
        condition: on-failure

  openbao-unseal:
    image: alpine/curl:latest
    # Polls every 30s; unseals if sealed. No-ops if OPENBAO_UNSEAL_KEY is blank (pre-init state).
    # Set OPENBAO_UNSEAL_KEY in Portainer stack env after running 'bao operator init'.
    command: >
      sh -c '
        while true; do
          if [ -z "$$OPENBAO_UNSEAL_KEY" ]; then
            sleep 30;
            continue;
          fi;
          SEALED=$$(curl -sf http://openbao:8200/v1/sys/health | grep -c "\"sealed\":true" || true);
          if [ "$$SEALED" -gt 0 ]; then
            curl -sf -X PUT http://openbao:8200/v1/sys/unseal \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"$$OPENBAO_UNSEAL_KEY\"}";
          fi;
          sleep 30;
        done
      '
    environment:
      - OPENBAO_UNSEAL_KEY=${OPENBAO_UNSEAL_KEY:-}
    networks:
      - openbao-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.ceph_mount == true
          - node.labels.type != restricted
      restart_policy:
        condition: on-failure

networks:
  openbao-internal:
    name: openbao-internal
    driver: overlay
  proxy_private:
    external: true
  kuma_network:
    external: true
    name: kuma_network
